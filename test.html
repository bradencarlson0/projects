<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator Tests</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        #test-results { margin-top: 20px; border-top: 1px solid #ccc; padding-top: 10px; }
        .test-result { margin-bottom: 5px; padding: 5px; border-radius: 3px; }
        .pass { background-color: #d4edda; color: #155724; border: 1px solid #c3e6cb; }
        .fail { background-color: #f8d7da; color: #721c24; border: 1px solid #f5c6cb; }
        .summary { margin-bottom: 10px; font-weight: bold; }
        /* Hide the calculator UI elements, they are only for script.js to use */
        #calculator-ui { display: none; }
    </style>
</head>
<body>
    <h1>Calculator Test Results</h1>
    <div id="test-summary" class="summary">Running tests...</div>
    <div id="test-results"></div>

    <!-- Calculator UI elements for script.js to interact with (hidden) -->
    <div id="calculator-ui">
        <!-- Copied from index.html -->
        <input type="number" id="buy-purchase-price">
        <input type="number" id="buy-down-payment">
        <input type="number" id="buy-loan-term">
        <input type="number" id="buy-interest-rate">

        <input type="number" id="sell-selling-price">
        <input type="number" id="sell-down-payment">
        <input type="number" id="sell-loan-term">
        <input type="number" id="sell-interest-rate">

        <span id="result-buy-monthly-payment"></span>
        <span id="result-sell-monthly-payment"></span>
        <span id="result-net-initial-investment"></span>
        <span id="result-monthly-cashflow"></span>
        <span id="buy-total-principal"></span>
        <span id="buy-total-interest"></span>
        <span id="sell-total-principal"></span>
        <span id="sell-total-interest"></span>
        <span id="total-cashflow-over-term"></span>

        <button id="calculate-button">Calculate</button>
    </div>

    <script src="script.js"></script>
    <script src="test.js"></script>
</body>
</html>
